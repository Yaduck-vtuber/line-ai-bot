steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/line-ai-bot:$COMMIT_SHA', '.']
  # Push the container image to Artifact/Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/line-ai-bot:$COMMIT_SHA']

images:
  - 'gcr.io/$PROJECT_ID/line-ai-bot:$COMMIT_SHA'
